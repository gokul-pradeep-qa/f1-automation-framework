<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PitWall AI Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🏎️ PitWall AI</h1>
        <p>Formula 1 Automation Dashboard</p>
    </header>

    <main id="dashboard">

    <div class="metric-card">
        <span class="icon">✅</span>
        <h2 id="passed">15</h2>
        <p>Tests Passed</p>
    </div>

    <div class="metric-card">
        <span class="icon">❌</span>
        <h2 id="failed">0</h2>
        <p>Tests Failed</p>
    </div>

    <div class="metric-card">
        <span class="icon">⏱</span>
        <h2 id="duration">18.2 sec</h2>
        <p>Execution Time</p>
    </div>

    <div class="metric-card">
        <span class="icon">❤️</span>
        <h2 id="health">100%</h2>
        <p>API Health</p>
    </div>

    <div class="metric-card">
        <span class="icon">🏁</span>
        <h2 id="meeting">Hungarian GP</h2>
        <p>Latest Grand Prix</p>
    </div>

    <div class="metric-card">
        <span class="icon">👥</span>
        <h2 id="drivers">22</h2>
        <p>Drivers</p>
    </div>

</main>

    <script src="app.js"></script>

</body>
</html>
